[package]
name = "ndimon-package"
description = "Native Debian maintainer hooks for NDIMon-R"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false
autoexamples = false
autobenches = false

[lints]
workspace = true

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "ndimon-package"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nix = { version = "0.29", features = ["user", "fs"] }

