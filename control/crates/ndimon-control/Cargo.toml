[package]
name = "ndimon-control"
description = "NDIMon-R control plane: HTTP API, SSE, state actor, reconciler and renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autoexamples = false
autobenches = false

[lints]
workspace = true

[features]
default = []
dev-tools = ["dep:ndimon-privd", "dep:ndimon-render", "dep:ndimon-netengine"]

[[bin]]
name = "ndimon-p2-fixture"
path = "src/bin/ndimon-p2-fixture.rs"
required-features = ["dev-tools"]
test = false
bench = false

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "ndimon-control"
path = "src/main.rs"
test = false
bench = false

[dependencies]
argon2.workspace = true
axum.workspace = true
futures-util = "0.3"
getrandom.workspace = true
hex = "0.4"
listenfd = "1.0"
ndimon-privd-proto = { workspace = true, features = ["client"] }
ndimon-types.workspace = true
ndimon-tessera.workspace = true
ndimon-state = { path = "../ndimon-state" }
ndimon-render = { path = "../ndimon-render", optional = true }
ndimon-privd = { path = "../ndimon-privd", optional = true }
ndimon-netengine = { workspace = true, optional = true }
ndimon-compat = { path = "../ndimon-compat" }
nix = { version = "0.29", features = ["user", "fs", "net", "hostname"] }
percent-encoding = "2"
scrypt = { version = "0.11", default-features = false }
sd-notify = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
tokio.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

# Debian payloads and native maintainer hooks are assembled by cargo xtask build-deb.
