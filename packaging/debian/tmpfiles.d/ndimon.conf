# Ownership preserves the manual installer and design inventory A.5 / incident #1.
# No unit may use StateDirectory= on these trees: it recursively re-owns shared
# parents and private journal leaves. tmpfiles is the single directory owner.
d /var/lib/ndimon                   3770 root           ndimon         -
d /var/lib/ndimon/.ndi              2770 ndimon         ndimon         -
d /var/lib/ndimon/net               3770 root           ndimon         -
d /var/lib/ndimon/net/pending        0700 root           root           -
d /var/lib/ndimon/net/vlans          0700 root           root           -
d /var/lib/ndimon/plugins            0755 root           root           -
d /var/lib/ndimon/import             3770 ndimon-control ndimon         -
d /var/lib/ndimon/backups            2770 ndimon-control ndimon         -
d /var/lib/ndimon-network            0700 root           root           -
d /var/lib/ndimon/state              0750 ndimon-control ndimon-control -
d /var/lib/ndimon/assets             0750 ndimon-control ndimon-control -

d /run/ndimon                       0755 root           root           -
# Service-private SDK copies; never re-own the shared parent at service start.
d /run/ndimon/ndi                   0755 root           root           -
d /run/ndimon/ndi/decoder           0700 root           root           -
d /run/ndimon/ndi/finder            0700 ndimon-finder  ndimon-finder  -
# Finder owns only discovery outputs; the shared parent and privd socket stay root-owned.
d /run/ndimon/finder                0755 ndimon-finder  ndimon-finder -
f /run/ndimon/ndi_src_find_param     0660 root           ndimon-finder -
L+ /run/ndimon/ndimon-sources.json   - - - - /run/ndimon/finder/ndimon-sources.json
L+ /run/ndimon/NDIFinderSrcList.json - - - - /run/ndimon/finder/NDIFinderSrcList.json
L+ /run/ndimon/finder.sock           - - - - /run/ndimon/finder/control.sock
# Existing status tooling/older APIs still use these catalog/trigger paths.
L+ /var/lib/ndimon/ndimon-sources.json - - - - /run/ndimon/ndimon-sources.json
L+ /var/lib/ndimon/NDIFinderSrcList.json - - - - /run/ndimon/NDIFinderSrcList.json
L+ /var/lib/ndimon/ndi_src_find_param - - - - /run/ndimon/ndi_src_find_param

d /run/ndimon/privd-jobs             0700 root root 1d
# Runtime bundles are executed from here, so not below /run (noexec on Debian 13 and Ubuntu).
d /var/lib/ndimon-privd             0700 root root -
d /var/lib/ndimon-privd/bundles     0700 root root 1d
d /var/lib/ndimon-updates           0700 root root -
d /etc/ndimon                       0755 root root -
d /opt/ndimon-r/plugins              0755 root root -

# privd's socket directory (systemd binds the socket; never writable by others).
d /run/ndimon-privd                 0755 root root -
d /run/ndimon-control              0755 ndimon-control ndimon-control -
