# NDIMon-R is MIT; permit the reviewed permissive and file-level copyleft set.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Mozilla CA root data used by the signed-update HTTPS transport. Its
# permissive data license is shipped with ndimon-privd's Debian package.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# chrono is used only to format and parse RFC 3339 UTC timestamps in the network
# engine (handoff created_at, pending-change expiry). The advisory reports the
# crate as unmaintained, not a vulnerability; replacing it is a follow-up.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; RFC 3339 formatting only, replacement tracked" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
