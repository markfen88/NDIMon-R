[package]
name = "ndimon-netengine"
description = "NDIMon-R network engine: networkd, Netplan, NetworkManager and ifupdown backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autoexamples = false
autobenches = false
autobins = false

[features]
default = []
harness = []

[lints]
workspace = true

[lib]
test = false
bench = false
doctest = false

[dependencies]
ndimon-types.workspace = true
ndimon-render = { path = "../ndimon-render" }
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
nix = { version = "0.29", features = ["fs", "user", "signal"] }
subtle = "2.6"
yaml-rust2 = "0.10"
glob = "0.3"
rustix = { version = "1", features = ["fs"] }
sha2 = "0.10"

