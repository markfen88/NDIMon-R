# Separate shared-data, discovery and control identities. privd stays root.
# `ndimon` owns the shared data directory's group; no service runs as it.
u ndimon - "NDIMon-R shared data owner" /var/lib/ndimon /usr/sbin/nologin
u ndimon-finder - "NDIMon-R source finder" /run/ndimon/finder /usr/sbin/nologin
u ndimon-control - "NDIMon-R control plane" /var/lib/ndimon/state /usr/sbin/nologin
# Traverse the shared root:ndimon 3770 parent without changing its owner/mode.
m ndimon-control ndimon
# Native Tessera control.sock access (safe before the optional bundle installs).
g tessera -
g tessera-admin -
m ndimon-control tessera
m ndimon-control tessera-admin

# The privileged-socket group, granted only through ndimon-control's
# SupplementaryGroups=; nobody is a persistent member.
g ndimon-priv-control -

m ndimon video
m ndimon render
m ndimon audio
