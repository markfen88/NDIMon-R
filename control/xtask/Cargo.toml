[package]
name = "xtask"
description = "NDIMon-R build, check and packaging tasks (cargo xtask)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false
autoexamples = false
autobenches = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ndimon-types = { workspace = true, features = ["ts", "schema"] }
ndimon-release.workspace = true
ndimon-privd-proto.workspace = true
minisign = "=0.7.9"
serde_json = { workspace = true, features = ["preserve_order"] }
ts-rs.workspace = true
schemars.workspace = true
sha2 = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
tar = "0.4"
tempfile = "3"
